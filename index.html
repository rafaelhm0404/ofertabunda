<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#08090C">
  <title>Truque da Cavala — Descubra o seu tipo</title>
  
  <meta property="og:title" content="Truque da Cavala — Descubra o seu tipo">
  <meta property="og:image" content="https://i.ibb.co/93GwmYCC/RESET-2.png">

  <!-- Google Fonts: Rubik + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Modernos Otimizados -->
  <link rel="stylesheet" href="style.css">

  <!-- Script UTMify para preservação de parâmetros de anúncios -->
  <script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>
</head>
<body>

  <!-- Topo com Navegação, Marca e Progresso Fluido -->
  <header class="qb-top">
    <div class="qb-head">
      <button class="qb-back" id="qb-back" type="button" aria-label="Voltar">&#8592;</button>
      <div class="qb-brand">
        <img class="qb-logo" src="https://desinflameja.site/images/brenda-avatar.webp" alt="Brenda" width="40" height="40" />
        <span class="qb-lockup" aria-label="Truque da Cavala">
          <span class="qb-lockup-1">TRUQUE DA</span>
          <span class="qb-lockup-2">CAVALA</span>
        </span>
      </div>
      <div style="width: 38px;"></div> <!-- Balanço visual do flex -->
    </div>
    <div class="qb-progress">
      <div class="qb-progress-fill" id="meter-fill"></div>
    </div>
  </header>

  <!-- Container Principal Reativo -->
  <main class="quiz-app" id="quiz-app">
    <div id="step-container"></div>
  </main>

  <!-- Barra Fixa Inferior de Conversão (CTA Dock) -->
  <div class="cta-dock" id="cta-dock"></div>


  <!-- Dados e Motor do Funil -->
  <script src="quiz-data.js"></script>
  <script src="app.js"></script>

</body>
</html>
